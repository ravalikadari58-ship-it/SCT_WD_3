<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Quiz Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.quiz-container{
    background:#fff;
    width:700px;
    max-width:100%;
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

#question{
    font-size:1.3rem;
    margin-bottom:20px;
    font-weight:600;
}

.options{
    margin-bottom:20px;
}

.option{
    display:block;
    padding:12px;
    margin:10px 0;
    background:#f4f4f4;
    border-radius:8px;
    cursor:pointer;
}

.option:hover{
    background:#e8e8e8;
}

input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.buttons{
    display:flex;
    justify-content:space-between;
}

button{
    padding:12px 24px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-size:16px;
}

#nextBtn{
    background:#3b82f6;
}

#submitBtn{
    background:#22c55e;
}

button:hover{
    opacity:0.9;
}

.result{
    text-align:center;
}

.result h2{
    margin-bottom:15px;
}
</style>
</head>
<body>

<div class="quiz-container">
    <h1>Quiz Game</h1>

    <div id="quiz">
        <div id="question"></div>
        <div id="options" class="options"></div>

        <div class="buttons">
            <button id="nextBtn">Next</button>
            <button id="submitBtn" style="display:none;">
                Submit Quiz
            </button>
        </div>
    </div>

    <div id="result" class="result"></div>
</div>

<script>

const quizData = [

{
    type:"single",
    question:"Which language runs in a web browser?",
    options:["Python","Java","JavaScript","C++"],
    answer:"JavaScript"
},

{
    type:"multiple",
    question:"Select Front-End Technologies:",
    options:["HTML","CSS","Node.js","JavaScript"],
    answer:["HTML","CSS","JavaScript"]
},

{
    type:"fill",
    question:"Fill in the blank: HTML stands for ______ Markup Language.",
    answer:"HyperText"
},

{
    type:"single",
    question:"Which company developed Java?",
    options:["Microsoft","Sun Microsystems","Google","Apple"],
    answer:"Sun Microsystems"
}

];

let currentQuestion = 0;
let score = 0;
let userAnswers = [];

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const submitBtn = document.getElementById("submitBtn");
const resultEl = document.getElementById("result");

function loadQuestion(){

    const q = quizData[currentQuestion];

    questionEl.textContent =
        `${currentQuestion + 1}. ${q.question}`;

    optionsEl.innerHTML = "";

    if(q.type === "single"){

        q.options.forEach(option=>{

            optionsEl.innerHTML += `
                <label class="option">
                    <input type="radio"
                           name="answer"
                           value="${option}">
                    ${option}
                </label>
            `;
        });
    }

    else if(q.type === "multiple"){

        q.options.forEach(option=>{

            optionsEl.innerHTML += `
                <label class="option">
                    <input type="checkbox"
                           value="${option}">
                    ${option}
                </label>
            `;
        });
    }

    else if(q.type === "fill"){

        optionsEl.innerHTML = `
            <input type="text"
                   id="fillAnswer"
                   placeholder="Type your answer">
        `;
    }

    if(currentQuestion === quizData.length - 1){
        nextBtn.style.display = "none";
        submitBtn.style.display = "inline-block";
    } else {
        nextBtn.style.display = "inline-block";
        submitBtn.style.display = "none";
    }
}

function saveAnswer(){

    const q = quizData[currentQuestion];

    if(q.type === "single"){

        const selected =
            document.querySelector(
                'input[name="answer"]:checked'
            );

        userAnswers[currentQuestion] =
            selected ? selected.value : null;
    }

    else if(q.type === "multiple"){

        const selected =
            [...document.querySelectorAll(
                'input[type="checkbox"]:checked'
            )]
            .map(cb => cb.value);

        userAnswers[currentQuestion] = selected;
    }

    else if(q.type === "fill"){

        const text =
            document.getElementById("fillAnswer").value;

        userAnswers[currentQuestion] =
            text.trim();
    }
}

nextBtn.addEventListener("click",()=>{

    saveAnswer();

    currentQuestion++;

    loadQuestion();
});

submitBtn.addEventListener("click",()=>{

    saveAnswer();

    calculateScore();

    showResult();
});

function calculateScore(){

    score = 0;

    quizData.forEach((q,index)=>{

        const userAnswer = userAnswers[index];

        if(q.type === "single"){

            if(userAnswer === q.answer){
                score++;
            }
        }

        else if(q.type === "multiple"){

            if(
                JSON.stringify(
                    [...userAnswer].sort()
                ) ===
                JSON.stringify(
                    [...q.answer].sort()
                )
            ){
                score++;
            }
        }

        else if(q.type === "fill"){

            if(
                userAnswer &&
                userAnswer.toLowerCase() ===
                q.answer.toLowerCase()
            ){
                score++;
            }
        }
    });
}

function showResult(){

    document.getElementById("quiz")
        .style.display = "none";

    resultEl.innerHTML = `
        <h2>Quiz Completed 🎉</h2>
        <h3>Your Score:
            ${score} / ${quizData.length}
        </h3>
        <p>
            ${score >= quizData.length*0.7
                ? "Excellent Work!"
                : "Keep Practicing!"}
        </p>

        <button onclick="location.reload()"
                style="
                margin-top:15px;
                background:#3b82f6;
                padding:10px 20px;
                border:none;
                color:white;
                border-radius:8px;">
            Restart Quiz
        </button>
    `;
}

loadQuestion();

</script>

</body>
</html>
